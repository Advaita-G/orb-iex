# Installed as /etc/systemd/journald.conf.d/orb-iex.conf
# Caps the system journal (which holds the bot's console output) so it cannot
# fill the disk. The bot's own JSON logs are rotated by the bot itself
# (gzip after 1 day, delete after runtime.log_retention_days).
[Journal]
SystemMaxUse=300M
SystemKeepFree=1G
MaxRetentionSec=30day
